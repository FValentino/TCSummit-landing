schema: spec-driven

context: |
  Project: TCSummit 2027 marketing landing (public site + corporate /partners view).
  Stack: Next.js 16.3.5 (App Router, reactCompiler on), React 19.2.3, TypeScript 5.9 strict, Tailwind v4 (CSS-first, no tailwind.config).
  UI: hand-rolled shadcn-style primitives in src/components/common/ui/ (Radix Slot + cn()), framer-motion 12.34.0, lucide-react.
  Structure: src/app/{route}/page.tsx + src/components/{domain}/{component}/{component}.tsx with co-located {component}Data.ts.
  Testing: no test runner configured. Verification relies on tsc --noEmit, eslint, and next build.
  Branch policy: work happens on `partners`; main serves the public landing.
  Language: SDD artifacts in English; user-facing UI copy in Spanish (existing project convention).

session:
  execution_mode: interactive
  artifact_store: hybrid
  chained_pr_strategy: force-chained
  review_budget_lines: 400

testing:
  strict_tdd: false
  strict_tdd_reason: >
    No test runner, test config, or CI pipeline is configured in this repository
    (no vitest/jest/playwright/cypress, no .github/, no test script). RED-GREEN-REFACTOR
    is not enforceable. Introducing a test runner is itself a change that must go through
    the SDD cycle before strict_tdd can be enabled.
  test_command: ""
  typecheck_command: "npx tsc --noEmit"
  lint_command: "npm run lint"
  build_command: "npm run build"
  coverage_command: ""
  test_runner: none
  test_layers:
    unit: unavailable
    integration: unavailable
    e2e: unavailable
  quality_tools:
    linter: "eslint 9 (eslint-config-next core-web-vitals + typescript)"
    type_checker: "typescript 5.9.3 (tsc --noEmit)"
    formatter: none
  baseline:
    typecheck: pass
    lint: "2 pre-existing errors + 4 warnings (all outside new work)"
    build: not run at init time

rules:
  proposal:
    - Scope the change to one reviewable work unit; anything over 400 diff lines MUST be split into a chained PR.
    - State explicitly whether the change adds a test runner dependency.
    - For visual/interactive sections, describe the mobile-first behavior before the desktop behavior.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - User-facing copy requirements MUST be written in Spanish to match the existing site.
    - Every interactive element MUST specify keyboard and focus behavior.
  design:
    - Reuse existing primitives (src/components/common/ui, ParticlesBackground) before adding new ones.
    - Import motion from `framer-motion` (the `motion` package is NOT installed).
    - Co-locate content data in a sibling {component}Data.ts module instead of inlining in the component.
    - Keep new files under 300 lines; extract sub-components or hooks when approaching the limit.
    - Document accessibility decisions (aria labels, reduced-motion, focus management) explicitly.
  tasks:
    - Group by phase with hierarchical numbering.
    - Keep each task completable in one session.
    - Keep component, its data module, and its nav anchor in the same task when they are inseparable.
  apply:
    - Follow existing code patterns in src/components/partners/**.
    - Hardcode the established brand hex tokens; do not introduce a new theme palette.
    - tdd: false
    - test_command: ""
    - typecheck_command: "npx tsc --noEmit"
  verify:
    - test_command: ""
    - typecheck_command: "npx tsc --noEmit"
    - lint_command: "npm run lint"
    - build_command: "npm run build"
    - coverage_threshold: 0
    - Known pre-existing lint failures must not be counted as regressions:
      - src/components/introduction/description/introductionDescription.tsx (2x no-explicit-any)
  archive:
    - Warn before merging destructive deltas.
    - Archive path: openspec/changes/archive/YYYY-MM-DD-{change-name}/
